[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duebook"
version = "0.1.0"
description = "Structured event memory for long-running support tickets: context that stays current and commitments that are kept."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/duebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
