[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duebook"
version = "0.1.0"
description = "Structured event memory for long-running support tickets: context that stays current and commitments that are kept."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "tzdata"]

[project.optional-dependencies]
store = ["psycopg[binary]>=3.2"]
# The runnable service: HTTP API, processor, scheduler, delivery workers.
service = [
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
# The Mem0 baseline of the benchmark. Pinned: its pipeline changes between
# releases, and the reported numbers are for this one.
mem0 = ["mem0ai==2.2.1"]
# The Graphiti baseline, with its embedded graph database (FalkorDB Lite,
# Python 3.12+). Pinned for the same reason.
graphiti = ["graphiti-core[falkordblite]==0.31.2"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]


[project.scripts]
duebook = "duebook.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/duebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    # Starlette's test client warns that it will move off httpx; nothing to act on here.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
