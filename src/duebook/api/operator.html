<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>duebook · Рабочее пространство оператора</title>
  <style>
    body {
      max-width: 1024px;
      margin: 20px auto;
      padding-inline: 12px;
      font: 400 14px/1.5 system-ui, sans-serif;
    }

  @font-face {
    font-family: "Golos Text";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("{{fonts}}/golos-cyrillic.woff2") format("woff2");
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }

  @font-face {
    font-family: "Golos Text";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("{{fonts}}/golos-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  @font-face {
    font-family: "Literata";
    font-style: normal;
    font-weight: 400 600;
    font-display: swap;
    src: url("{{fonts}}/literata-cyrillic.woff2") format("woff2");
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }

  @font-face {
    font-family: "Literata";
    font-style: normal;
    font-weight: 400 600;
    font-display: swap;
    src: url("{{fonts}}/literata-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }


  #duebook-operator .db-app {
    color-scheme: light dark;
    --db-ink: light-dark(#1c2534, #edf0f6);
    --db-muted: light-dark(#515b6c, #b5bfce);
    --db-stock: light-dark(#f7f4ed, #22262c);
    --db-surface: light-dark(#fefdf9, #1b1f26);
    --db-panel: light-dark(#efefe9, #242a32);
    --db-hairline: light-dark(#d6d3c9, #414a58);
    --db-divider: light-dark(#b0afa7, #626b7a);
    --db-index: light-dark(#233e9f, #b1c3ff);
    --db-index-wash: light-dark(#e9edfa, #303e64);
    --db-attention: light-dark(#913c26, #f2aa95);
    --db-meta-font: ui-monospace, "SFMono-Regular", Consolas, monospace;
    --db-display-font: "Literata", Georgia, serif;
    --db-gutter: 30px;
    --db-gap: 16px;
    overflow: clip;
    border: 1px solid var(--db-divider);
    border-radius: 9px;
    color: var(--db-ink);
    background: var(--db-surface);
    box-shadow: 0 2px 4px light-dark(#1c253411, #0004);
    font: 400 14px/1.5 "Golos Text", system-ui, sans-serif;
  }


  #duebook-operator .db-brand,
  #duebook-operator .db-ticket,
  #duebook-operator .db-nav {
    padding-inline: var(--db-gutter);
  }

  #duebook-operator .db-brand {
    padding-block: 12px;
    border-bottom: 1px solid var(--db-hairline);
  }

  #duebook-operator .db-lockup {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--db-index);
  }

  #duebook-operator .db-arch {
    position: relative;
    width: 19px;
    height: 21px;
    margin-inline-end: 1px;
    border: 1.5px solid currentColor;
    border-radius: 50% 50% 0 0 / 44% 44% 0 0;
  }

  #duebook-operator .db-arch::after {
    position: absolute;
    inset: 5px 4px 0;
    border: 1px solid currentColor;
    border-bottom: 0;
    border-radius: 50% 50% 0 0 / 42% 42% 0 0;
    content: "";
  }

  #duebook-operator .db-parent {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .025em;
  }

  #duebook-operator .db-wordmark {
    margin-inline-start: 4px;
    padding-inline-start: 12px;
    border-inline-start: 1px solid var(--db-hairline);
    color: var(--db-ink);
    font: 600 19px/1.2 var(--db-display-font);
    letter-spacing: -.055em;
  }

  #duebook-operator .db-ticket p,
  #duebook-operator .db-meta,
  #duebook-operator .db-source-byline {
    color: var(--db-muted);
    font-size: 12px;
  }

  #duebook-operator .db-ticket {
    padding-block: 23px 19px;
    background: var(--db-stock);
  }

  #duebook-operator .db-context {
    color: var(--db-index);
    font: 600 11px/1.3 var(--db-meta-font);
    letter-spacing: .015em;
  }

  #duebook-operator .db-ticket h1 {
    margin: 8px 0 9px;
    font: 500 clamp(26px, 4.6vw, 44px)/1.1 var(--db-display-font);
    letter-spacing: -.04em;
  }

  #duebook-operator .db-ticket p { margin: 0; }

  #duebook-operator .db-nav {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 22px;
    border-block: 1px solid var(--db-hairline);
  }

  #duebook-operator .db-app button { font: inherit; color: inherit; }

  #duebook-operator .db-nav button[data-view] {
    position: relative;
    padding: 10px 1px;
    border: 0;
    background: transparent;
    color: var(--db-muted);
    font-size: 13px;
  }

  #duebook-operator .db-nav button[data-view]:hover,
  #duebook-operator .db-nav button[data-view][aria-pressed="true"] {
    color: var(--db-index);
  }

  #duebook-operator .db-nav button[data-view][aria-pressed="true"]::after {
    position: absolute;
    inset-inline: 0;
    bottom: -1px;
    height: 2px;
    background: currentColor;
    content: "";
  }

  #duebook-operator .db-nav .db-chat-toggle,
  #duebook-operator .db-chat-head .db-chat-close {
    padding: 4px 8px;
    border: 1px solid var(--db-hairline);
    border-radius: 3px;
    background: var(--db-surface);
    color: var(--db-index);
    font-size: 12px;
  }

  #duebook-operator .db-chat-toggle { margin-inline-start: auto; }

  #duebook-operator .db-chat-toggle:hover,
  #duebook-operator .db-chat-toggle[aria-expanded="true"],
  #duebook-operator .db-chat-close:hover {
    border-color: var(--db-index);
    background: var(--db-index-wash);
  }

  #duebook-operator .db-body {
    display: grid;
  }

  #duebook-operator .db-work {
    min-width: 0;
    padding: 21px var(--db-gutter) 24px;
  }

  #duebook-operator .db-work h3,
  #duebook-operator .db-source h3 {
    margin: 0;
    color: var(--db-ink);
    font: 550 18px/1.3 var(--db-display-font);
    letter-spacing: -.025em;
  }

  #duebook-operator .db-work-head {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px 14px;
    margin-bottom: 13px;
  }

  #duebook-operator .db-work ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  #duebook-operator .db-row {
    position: relative;
    padding-block: var(--db-gap);
    border-top: 1px solid var(--db-hairline);
  }

  #duebook-operator .db-row:last-child { padding-bottom: 0; }

  #duebook-operator .db-row:has(button[data-source][aria-pressed="true"])::before {
    position: absolute;
    inset-block-start: var(--db-gap);
    inset-inline-start: calc(var(--db-gutter) * -.5);
    width: 2px;
    height: 20px;
    background: var(--db-index);
    content: "";
  }

  #duebook-operator .db-row-head,
  #duebook-operator .db-citations {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 13px;
  }

  #duebook-operator .db-row-head strong {
    font-size: 15px;
    font-weight: 600;
  }

  #duebook-operator .db-status {
    color: var(--db-muted);
    font-size: 11px;
    font-weight: 500;
  }

  #duebook-operator .db-status[data-attention] {
    color: var(--db-attention);
    font-weight: 650;
  }

  #duebook-operator .db-meta { margin: 4px 0 8px; }
  #duebook-operator .db-row-head + .db-citations { margin-top: 8px; }

  #duebook-operator .db-row[data-unread] {
    padding: 10px;
    background: var(--db-stock);
  }

  #duebook-operator .db-row[data-unread] .db-row-head strong { font-size: 13px; }

  #duebook-operator .db-sections { margin-top: 19px; }

  #duebook-operator .db-section { border-top: 1px solid var(--db-hairline); }

  #duebook-operator .db-section:last-child { border-bottom: 1px solid var(--db-hairline); }

  #duebook-operator .db-section summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 0;
    list-style: none;
    font-size: 12px;
    font-weight: 500;
  }

  #duebook-operator .db-section summary::-webkit-details-marker { display: none; }

  #duebook-operator .db-section summary::before {
    width: 5px;
    height: 5px;
    border-inline-end: 1px solid var(--db-index);
    border-block-end: 1px solid var(--db-index);
    transform: rotate(-45deg);
    content: "";
  }

  #duebook-operator .db-section[open] summary::before { transform: rotate(45deg); }

  #duebook-operator .db-section-count {
    margin-inline-start: auto;
    color: var(--db-muted);
    font: 400 11px/1 var(--db-meta-font);
  }

  #duebook-operator .db-section ul { padding: 0 0 10px 13px; }

  #duebook-operator .db-citations { gap: 6px; }

  #duebook-operator .db-citations button {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    padding: 3px 7px;
    border: 1px solid var(--db-hairline);
    border-radius: 2px;
    background: transparent;
    color: var(--db-index);
    font-size: 11px;
  }

  #duebook-operator .db-citations button span,
  #duebook-operator .db-article-id {
    font-family: var(--db-meta-font);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  #duebook-operator .db-citations button:hover {
    background: var(--db-index-wash);
  }

  #duebook-operator .db-citations button[aria-pressed="true"] {
    border-color: var(--db-index);
    background: var(--db-index-wash);
  }

  #duebook-operator .db-source {
    min-width: 0;
    margin: 16px var(--db-gutter) 0;
    border: 1px solid var(--db-hairline);
    border-radius: 4px;
    background: var(--db-panel);
  }

  #duebook-operator .db-chat-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--db-hairline);
  }

  #duebook-operator .db-messages {
    max-height: min(52dvh, 440px);
    margin: 0;
    padding: 4px 8px;
    overflow-y: auto;
    overscroll-behavior-y: contain;
    list-style: none;
  }

  #duebook-operator .db-message {
    padding: 8px 12px;
    border-inline-start: 2px solid transparent;
  }

  #duebook-operator .db-message + .db-message { border-top: 1px solid var(--db-hairline); }

  #duebook-operator .db-message[aria-current="true"] {
    border-inline-start-color: var(--db-index);
    background: var(--db-index-wash);
  }

  #duebook-operator .db-message:focus-visible,
  #duebook-operator .db-messages:focus-visible {
    outline: 1px solid var(--db-index);
    outline-offset: -1px;
  }

  #duebook-operator .db-message-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 2px 8px;
    color: var(--db-muted);
    font-size: 11px;
  }

  #duebook-operator .db-message-header strong { font-weight: 600; }
  #duebook-operator .db-message[aria-current="true"] .db-message-header { color: var(--db-index); }
  #duebook-operator .db-source-byline { margin: 0 0 4px; font-size: 11px; }

  #duebook-operator .db-message-text {
    margin: 0;
    overflow-wrap: anywhere;
    font-size: 13px;
  }

  @media (min-width: 761px) {
    #duebook-operator .db-body:has(.db-source:not([hidden])) {
      grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr);
    }

    #duebook-operator .db-work { grid-area: 1 / 1; }

    #duebook-operator .db-source {
      grid-area: 1 / 2;
      position: sticky;
      top: 16px;
      align-self: start;
      margin-inline-start: 0;
    }
  }

  @media (pointer: coarse) {
    #duebook-operator .db-app button,
    #duebook-operator .db-auth input,
    #duebook-operator .db-section summary { min-height: 44px; }
    #duebook-operator .db-citations button { align-items: center; }
    #duebook-operator .db-access { column-gap: 12px; }
    #duebook-operator .db-access button { min-height: 44px; }
  }

  @media (max-width: 590px) {
    #duebook-operator .db-app { --db-gutter: 16px; }
    #duebook-operator .db-nav {
      gap: 8px;
      padding-inline: 12px;
    }
  }

  #duebook-operator [hidden] { display: none; }

  #duebook-operator .db-brand,
  #duebook-operator .db-access,
  #duebook-operator .db-auth-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
  }

  #duebook-operator .db-brand { justify-content: space-between; }
  #duebook-operator .db-access { font-size: 12px; }

  #duebook-operator .db-access a,
  #duebook-operator .db-message-header a {
    color: var(--db-index);
    text-underline-offset: 3px;
  }

  #duebook-operator .db-evidence-detail {
    margin: 6px 0 0;
    color: var(--db-attention);
    font-size: 12px;
  }

  #duebook-operator .db-message mark {
    color: inherit;
    background: transparent;
    text-decoration: underline;
    text-decoration-color: var(--db-index);
    text-underline-offset: 3px;
  }

  #duebook-operator .db-access button {
    padding: 0;
    border: 0;
    background: none;
    color: var(--db-index);
  }

  #duebook-operator .db-access button:hover { text-decoration: underline; }

  #duebook-operator .db-auth-controls {
    gap: 8px;
    margin-top: 6px;
  }

  #duebook-operator .db-auth input,
  #duebook-operator .db-auth button {
    box-sizing: border-box;
    max-width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--db-divider);
    border-radius: 3px;
    background: var(--db-surface);
    color: inherit;
    font: inherit;
  }

  #duebook-operator .db-auth input { width: 248px; font-size: 16px; }
  #duebook-operator .db-auth button { color: var(--db-index); }
  #duebook-operator .db-auth button:disabled { opacity: .6; }
  #duebook-operator .db-work-status { margin: 0 0 13px; color: var(--db-muted); }
  #duebook-operator .db-work-status:empty { margin: 0; }
  #duebook-operator .db-auth:not([hidden]) + .db-work-status:not(:empty) { margin: 13px 0 0; }
  #duebook-operator .db-ticket h1 { overflow-wrap: anywhere; }

  </style>
</head>
<body>
<main id="duebook-operator" data-provider="{{provider}}" aria-label="Рабочее пространство Duebook">
  <article class="db-app">
    <header class="db-brand">
      <div class="db-lockup">
        <span class="db-arch" aria-hidden="true"></span><span class="db-parent">Arch</span><span class="db-wordmark">duebook</span>
      </div>
      <div class="db-access" hidden>
        <a class="db-ticket-link" target="_blank" rel="noopener noreferrer"></a>
        <button type="button" class="db-lock">Отключиться</button>
      </div>
    </header>
    <div class="db-ticket">
      <div class="db-context" hidden></div>
      <h1>Обязательства по тикету</h1>
      <p class="db-ticket-meta" hidden></p>
    </div>
    <nav class="db-nav" aria-label="Представление тикета" hidden>
      <button type="button" data-view="card" aria-pressed="true">Карточка</button>
      <button type="button" class="db-chat-toggle" aria-expanded="false" aria-controls="db-ticket-chat">Переписка</button>
    </nav>
    <div class="db-body">
      <aside id="db-ticket-chat" class="db-source" aria-label="Переписка" hidden></aside>
      <div class="db-work">
        <form class="db-auth" method="post">
          <label for="db-access-token">Токен доступа</label>
          <div class="db-auth-controls">
            <input id="db-access-token" type="password" autocomplete="off" spellcheck="false" required>
            <button type="submit">Открыть карточку</button>
          </div>
        </form>
        <p class="db-work-status" role="status"></p>
        <section class="db-card" hidden>
          <div class="db-work-head">
            <h3>Обязательства и факты</h3>
            <div class="db-access"><button type="button" class="db-refresh">Обновить</button></div>
          </div>
          <div class="db-record"></div>
        </section>
      </div>
    </div>
  </article>
  <template id="db-row">
    <li class="db-row">
      <div class="db-row-head"><strong></strong><span class="db-status"></span></div>
      <div class="db-meta"></div>
      <div class="db-citations" role="group" aria-label="Сообщения-источники"></div>
    </li>
  </template>
  <template id="db-section">
    <details class="db-section">
      <summary><span class="db-section-name"></span><span class="db-section-count"></span></summary>
      <ul></ul>
    </details>
  </template>
  <template id="db-chat">
    <div class="db-chat-head">
      <h3>Переписка</h3>
      <button type="button" class="db-chat-close">Закрыть</button>
    </div>
    <ol class="db-messages" tabindex="0" aria-label="Сообщения тикета"></ol>
  </template>
  <template id="db-message">
    <li class="db-message" tabindex="-1">
      <div class="db-message-header"><strong></strong><a class="db-article-id" target="_blank" rel="noopener noreferrer"></a></div>
      <p class="db-source-byline"></p>
      <p class="db-message-text"></p>
    </li>
  </template>
</main>
<script>
(() => {
  const root = document.querySelector("#duebook-operator");
  const provider = root.dataset.provider;
  const title = root.querySelector(".db-ticket h1");
  const number = root.querySelector(".db-context");
  const ticketMeta = root.querySelector(".db-ticket-meta");
  const connection = root.querySelector(".db-brand .db-access");
  const ticketLink = root.querySelector(".db-ticket-link");
  const nav = root.querySelector(".db-nav");
  const chatToggle = nav.querySelector(".db-chat-toggle");
  const chat = root.querySelector(".db-source");
  const form = root.querySelector(".db-auth");
  const input = form.querySelector("input");
  const submit = form.querySelector("button");
  const status = root.querySelector(".db-work-status");
  const card = root.querySelector(".db-card");
  const record = card.querySelector(".db-record");
  const pageTitle = document.title;
  const lockedTitle = title.textContent;
  const narrow = matchMedia("(max-width: 760px)");
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
  const reviewUrl = location.pathname.replace(/\/$/, "") + "/review";
  let token = "";
  let pending;
  let activeCitation;

  ticketLink.textContent = "Открыть в " + provider;
  form.querySelector("label").textContent = "Токен доступа " + provider;
  chat.append(root.querySelector("#db-chat").content.cloneNode(true));
  const messages = chat.querySelector(".db-messages");
  const rowTemplate = root.querySelector("#db-row");
  const sectionTemplate = root.querySelector("#db-section");
  const messageTemplate = root.querySelector("#db-message");

  const lifecycle = {
    open: "Открыто", due_soon: "Срок приближается", breached: "Просрочено",
    claimed: "Должник сообщил о выполнении", fulfilled: "Выполнено",
    fulfilled_late: "Выполнено с опозданием", cancelled: "Отменено", superseded: "Заменено"
  };
  const resolution = {
    claimed: "Заявление о выполнении", cancelled: "Отмена", superseded: "Замена",
    counterparty_confirmation: "Подтвердила другая сторона",
    system_verification: "Подтвердила независимая система"
  };
  const confidence = {high: "высокая", medium: "средняя", low: "низкая"};
  const suggestionReasons = {
    target_mismatch: "Указано другое обязательство",
    not_about_target: "Сообщение не уточняет, какое обязательство выполнено",
    ambiguous_target: "Подходит несколько обязательств",
    verifier_rejected: "Проверка не подтвердила связь с обязательством",
    context_names_other: "В ответе упоминается другое обязательство",
    says_condition_holds: "Из сообщения следует, что условие выполнено",
    unknown_target: "Обязательство не опознано",
    already_resolved: "Указанное обязательство уже закрыто"
  };

  function source(label, evidence, detail = "") {
    return {...evidence, label, detail};
  }

  function suggestionSources(suggestions) {
    return suggestions.map(item =>
      source("Уточнить", item.source, suggestionReasons[item.reason] || item.reason)
    );
  }

  function addRows(list, rows) {
    for (const row of rows) {
      const fragment = rowTemplate.content.cloneNode(true);
      const item = fragment.querySelector(".db-row");
      item.toggleAttribute("data-unread", Boolean(row.unread));
      item.querySelector("strong").textContent = row.title;
      const state = item.querySelector(".db-status");
      state.textContent = row.status || "";
      state.toggleAttribute("data-attention", Boolean(row.attention));
      const meta = item.querySelector(".db-meta");
      meta.textContent = row.meta || "";
      meta.hidden = !row.meta;
      const citations = item.querySelector(".db-citations");
      for (const evidence of row.sources) {
        const button = document.createElement("button");
        const reference = document.createElement("span");
        const label = evidence.label;
        button.type = "button";
        button.dataset.source = evidence.article_id;
        button.dataset.label = label;
        button.setAttribute("aria-controls", chat.id);
        button.setAttribute("aria-pressed", "false");
        if (evidence.detail) button.title = evidence.detail;
        reference.textContent = "№" + (evidence.seq ?? evidence.article_id);
        button.append(label + " ", reference);
        button.addEventListener("click", () => load({conversation: true, evidence}));
        citations.append(button);
      }
      list.append(fragment);
    }
  }

  function commitmentRow(item, formatDate) {
    const owner = item.party === "customer" ? "Клиент" :
      item.responsible_name || (item.responsible_id ? "Оператор №" + item.responsible_id : "Без ответственного");
    const inherited = item.inherited_from
      ? "ранее " + (item.inherited_from_name || "оператор №" + item.inherited_from) : "";
    const deadline = item.deadline;
    const due = deadline ? "Срок " + formatDate(new Date(deadline.at)) : "Срок не определён";
    const certainty = deadline && "Уверенность " + confidence[deadline.confidence];
    const resolved = item.resolution;
    const sources = [source("Обещание", item.source)];
    if (item.activated_by) sources.push(source("Условие выполнено", item.activated_by));
    if (resolved) sources.push(source(resolution[resolved.kind] || "Решение", resolved.source));
    if (item.resolution_context) sources.push(source("Контекст", item.resolution_context));
    sources.push(...(item.repeats ?? []), ...suggestionSources(item.suggestions));
    const status = lifecycle[item.status];
    return {
      title: item.action, status, sources,
      attention: ["breached", "due_soon", "claimed"].includes(item.status) || Boolean(item.suggestions.length),
      meta: [owner, inherited, due, certainty].filter(Boolean).join(" · ")
    };
  }

  function renderCard(review) {
    const expanded = new Set([...record.querySelectorAll("details[open]")].map(section => section.dataset.section));
    const formatDate = new Intl.DateTimeFormat("ru-RU", {
      day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: review.timezone
    }).format;
    const active = [];
    const other = [];
    for (const commitment of review.commitments) {
      const list = ["open", "claimed"].includes(commitment.state) ? active : other;
      list.push(commitmentRow(commitment, formatDate));
    }
    const primary = document.createElement("ul");
    addRows(primary, [
      ...active.filter(row => row.attention),
      ...active.filter(row => !row.attention),
      ...review.unread.map(evidence => ({
        title: "Прочитать сообщение", status: "Ошибка разбора",
        unread: true, attention: true, sources: [source("Сообщение", evidence)]
      }))
    ]);
    const sections = [
      ["Условные обещания", review.conditionals.map(item => ({
        title: item.action, status: "Условие не подтверждено", meta: item.condition,
        sources: [source("Обещание", item.source), ...suggestionSources(item.suggestions)]
      }))],
      ["Открытые противоречия", review.contradictions.map(item => ({
        title: item.slot, status: "Требует проверки", attention: true,
        meta: item.facts.map(fact => fact.value).join(" · "),
        sources: item.facts.map(fact => source("Сообщение", fact.source))
      }))],
      ["Что известно сейчас", review.facts.map(fact => ({
        title: fact.value, meta: fact.slot, sources: [source("Сообщение", fact.source)]
      }))],
      ["Что изменилось", review.changes.map(([old, next]) => ({
        title: next.slot, meta: old.value + " → " + next.value,
        sources: [source("Ранее", old.source), source("Сейчас", next.source)]
      }))],
      ["Что уже пробовали", review.steps.map(step => ({
        title: step.action,
        status: {worked: "Помогло", failed: "Не помогло", pending: "Результат неизвестен"}[step.outcome],
        sources: [source("Действие", step.source), ...(step.outcome_source
          ? [source("Результат", step.outcome_source)] : [])]
      }))],
      ["Открытые вопросы", review.questions.map(question => ({
        title: question.text, status: question.waiting_on === "customer" ? "Ждём ответа клиента" : "Ждём ответа компании",
        sources: [source("Сообщение", question.source)]
      }))],
      ["Другие обязательства", other]
    ];
    const groups = document.createElement("div");
    groups.className = "db-sections";
    for (const [name, rows] of sections) {
      if (!rows.length) continue;
      const section = sectionTemplate.content.cloneNode(true);
      const details = section.querySelector("details");
      details.dataset.section = name;
      details.open = expanded.has(name);
      section.querySelector(".db-section-name").textContent = name;
      section.querySelector(".db-section-count").textContent = rows.length;
      addRows(section.querySelector("ul"), rows);
      groups.append(section);
    }
    if (!primary.children.length) {
      const empty = document.createElement("li");
      const pendingWork = review.processing.awaiting_sync || review.processing.backlog;
      empty.textContent = pendingWork ? "Карточка ещё обрабатывается." : "Открытых обязательств нет.";
      primary.append(empty);
    }
    record.replaceChildren(primary);
    if (groups.children.length) record.append(groups);
  }

  function closeChat(restoreFocus = false) {
    chat.hidden = true;
    chatToggle.setAttribute("aria-expanded", "false");
    activeCitation?.setAttribute("aria-pressed", "false");
    messages.replaceChildren();
    if (restoreFocus) (activeCitation || chatToggle).focus();
    activeCitation = undefined;
  }

  function showQuote(row, quote) {
    if (!quote) return;
    const text = row.querySelector(".db-message-text");
    const body = text.textContent;
    const start = body.indexOf(quote);
    if (start === -1 || body === quote) return;
    const mark = document.createElement("mark");
    mark.textContent = quote;
    text.replaceChildren(body.slice(0, start), mark, body.slice(start + quote.length));
  }

  function showConversation(items, evidence) {
    let cited;
    for (const message of items) {
      const fragment = messageTemplate.content.cloneNode(true);
      const row = fragment.querySelector(".db-message");
      row.querySelector("strong").textContent = message.author;
      const link = row.querySelector(".db-article-id");
      link.href = message.url;
      link.textContent = "№" + message.id + " ↗";
      link.setAttribute("aria-label", "Открыть сообщение №" + message.id + " в " + provider);
      link.title = link.getAttribute("aria-label");
      const visibility = message.internal ? "Внутреннее сообщение" : "Публичное сообщение";
      row.querySelector(".db-source-byline").textContent = message.time + " · " + visibility;
      row.querySelector(".db-message-text").textContent = message.body;
      if (String(message.id) === evidence?.article_id) cited = row;
      messages.append(fragment);
    }
    if (!items.length) {
      const empty = document.createElement("li");
      empty.className = "db-message";
      empty.textContent = "В тикете пока нет сообщений.";
      messages.append(empty);
    }
    chat.hidden = false;
    chatToggle.setAttribute("aria-expanded", "true");
    if (cited) {
      activeCitation = [...record.querySelectorAll("button[data-source]")].find(button =>
        button.dataset.source === evidence.article_id && button.dataset.label === evidence.label &&
        button.getClientRects().length
      );
      activeCitation?.setAttribute("aria-pressed", "true");
      cited.setAttribute("aria-current", "true");
      showQuote(cited, evidence.quote);
      if (evidence.detail) {
        const detail = document.createElement("p");
        detail.className = "db-evidence-detail";
        detail.textContent = evidence.detail;
        cited.append(detail);
      }
      const behavior = reducedMotion.matches ? "auto" : "smooth";
      if (narrow.matches) nav.scrollIntoView({block: "start", behavior});
      cited.focus({preventScroll: true});
      const top = messages.scrollTop + cited.getBoundingClientRect().top -
        messages.getBoundingClientRect().top - (messages.clientHeight - cited.offsetHeight) / 2;
      messages.scrollTo({top, behavior});
    } else {
      if (evidence) {
        resetAccess(accessErrors[409]);
        input.focus();
        return;
      }
      messages.scrollTop = messages.scrollHeight;
      messages.focus({preventScroll: true});
    }
  }

  function resetAccess(message = "") {
    pending?.abort();
    pending = undefined;
    token = "";
    input.value = "";
    submit.disabled = false;
    closeChat();
    record.replaceChildren();
    ticketLink.removeAttribute("href");
    card.hidden = nav.hidden = connection.hidden = number.hidden = ticketMeta.hidden = true;
    number.textContent = ticketMeta.textContent = "";
    form.hidden = !window.isSecureContext;
    document.title = pageTitle;
    title.textContent = lockedTitle;
    status.textContent = message;
  }

  const accessErrors = {
    401: "Токен не принят. Проверьте его и попробуйте снова.",
    403: "У вас нет доступа к этому тикету.",
    404: "Тикет недоступен.",
    409: "Источники изменились или недоступны. Проверьте тикет в системе поддержки."
  };

  async function load({conversation = false, evidence} = {}) {
    if (pending || !token) return;
    const request = new AbortController();
    pending = request;
    submit.disabled = true;
    const firstLoad = card.hidden;
    status.textContent = conversation ? "Проверяем доступ к переписке…" : "Обновляем карточку…";
    closeChat();
    try {
      const response = await fetch(reviewUrl + (conversation ? "?include_conversation=true" : ""), {
        headers: {Authorization: "Bearer " + token},
        cache: "no-store",
        signal: request.signal
      });
      if (pending !== request) return;
      if (!response.ok) {
        resetAccess(accessErrors[response.status] || "Не удалось загрузить карточку. Попробуйте ещё раз.");
        input.focus();
        return;
      }
      const review = await response.json();
      if (pending !== request) return;
      document.title = "Duebook · Тикет #" + review.number;
      number.textContent = "Тикет #" + review.number;
      title.textContent = review.title;
      ticketMeta.textContent = [review.owner && review.owner !== "-" ? "Ответственный: " + review.owner : "",
        review.ticket_state].filter(Boolean).join(" · ");
      ticketLink.href = review.url;
      card.hidden = nav.hidden = connection.hidden = number.hidden = false;
      ticketMeta.hidden = !ticketMeta.textContent;
      form.hidden = true;
      const {awaiting_sync, backlog, held} = review.processing;
      status.textContent = [
        awaiting_sync ? "Ожидают импорта: " + awaiting_sync : "",
        backlog ? "Ожидают обработки: " + backlog : "",
        held ? "Ошибка обработки. Событие №" + held + " будет обработано повторно." : ""
      ].filter(Boolean).join(" · ");
      renderCard(review);
      if (conversation) showConversation(review.messages, evidence);
      else if (firstLoad) card.querySelector(".db-refresh").focus();
    } catch {
      if (pending === request) {
        resetAccess("Не удалось загрузить карточку. Попробуйте ещё раз.");
        input.focus();
      }
    } finally {
      if (pending === request) {
        pending = undefined;
        submit.disabled = false;
      }
    }
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    if (pending) return;
    token = input.value.trim();
    input.value = "";
    load();
  });
  root.querySelector(".db-lock").addEventListener("click", () => {
    resetAccess();
    input.focus();
  });
  card.querySelector(".db-refresh").addEventListener("click", () => load());
  nav.querySelector("[data-view=card]").addEventListener("click", () => closeChat());
  chatToggle.addEventListener("click", () => chat.hidden ? load({conversation: true}) : closeChat());
  chat.querySelector(".db-chat-close").addEventListener("click", () => closeChat(true));
  chat.addEventListener("keydown", event => {
    if (event.key === "Escape") closeChat(true);
  });
  window.addEventListener("pagehide", () => resetAccess());
  if (!window.isSecureContext) resetAccess("Откройте эту страницу по HTTPS для доступа к карточке.");
})();
</script>
</body>
</html>
