name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duebook
          POSTGRES_PASSWORD: duebook
          POSTGRES_DB: duebook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duebook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Without this the store tests are skipped, and a green run would say
      # nothing about the event store or the outbox.
      TEST_DATABASE_URL: postgresql://duebook:duebook@localhost:5432/duebook_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q -rs
