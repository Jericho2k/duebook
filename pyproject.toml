[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duebook"
version = "0.1.0"
description = "Structured event memory for long-running support tickets: context that stays current and commitments that are kept."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "tzdata"]

[project.optional-dependencies]
store = ["psycopg[binary]>=3.2"]
# The Mem0 baseline of the benchmark. Pinned: its pipeline changes between
# releases, and the reported numbers are for this one.
mem0 = ["mem0ai==2.2.1"]
dev = ["pytest>=8", "ruff>=0.6", "psycopg[binary]>=3.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/duebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
